name: sokoyield

# Local development infrastructure.
# Postgres uses the TimescaleDB image (a superset of vanilla PostgreSQL) so the
# relational ledger and the Phase 5 time-series ticker can share one engine
# without a later data migration. The Timescale extension is NOT enabled until Phase 5.

services:
  postgres:
    image: timescale/timescaledb:2.21.0-pg17
    container_name: sokoyield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sokoyield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sokoyield_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sokoyield}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sokoyield} -d ${POSTGRES_DB:-sokoyield}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: sokoyield-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-sokoyield_dev_redis}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sokoyield_dev_redis}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Apache Kafka (single broker, KRaft mode - no ZooKeeper).
  # Per the architecture blueprint: asynchronous queue for offline-synced AI photo uploads.
  #   Host clients (API on your machine): localhost:${KAFKA_PORT:-9092}
  #   Containers on this network:        kafka:29092
  kafka:
    image: apache/kafka:4.1.0
    container_name: sokoyield-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by infra/docker/kafka-init (no accidental topics from typos)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot job: creates the platform topics, then exits.
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: sokoyield-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  # Kafka web UI: http://localhost:8082 (`docker compose --profile tools up -d`)
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: sokoyield-kafka-ui
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: sokoyield-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8082:8080"

  # Optional DB GUI: `docker compose --profile tools up -d`
  adminer:
    image: adminer:4
    container_name: sokoyield-adminer
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
