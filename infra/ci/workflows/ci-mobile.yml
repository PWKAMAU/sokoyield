name: CI - Mobile (Flutter)

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze-test-build:
    name: Analyze, test, build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Isar schema code generation
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze --fatal-infos

      - run: flutter test --coverage

      - name: Build debug APK (compile check)
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: sokoyield-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
